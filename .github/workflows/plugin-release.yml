name: Release DBX plugin

# GitHub Release 发布（published）时自动构建未签名候选包，
# 并合并生成 release-candidates.json 挂到该 Release。
# 复用 DBX 官方 reusable workflow；纯前端 universal 包，无需 Rust/Go。
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name }}
      # reusable workflow 只全局装 dbx-plugin CLI，不装项目依赖，
      # 故命令需先 npm ci（vue-tsc/vite 等都在 devDependencies），
      # 再 build:dbx 生成 gitignore 的 ui/，最后 package 输出到 dist/ 对齐 package-path。
      # DBX_PLUGIN_TARGET=universal 由 reusable workflow 按 build-matrix 注入。
      package-command: npm ci && npm run build:dbx && dbx-plugin package . --target universal --output-dir dist
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.10
      go-version: ""
      rust-toolchain: ""
      build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
